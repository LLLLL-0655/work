<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>多账本记账 · 手动输入图标</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg-color: #D9EBE3;
    --card-bg: #FFFFFF;
    --panel-green: #A8C8B8;
    --text-main: #4A5B52;
    --text-muted: #A3B5AB;
    --accent-green: #8FBBA7;
    --accent-red: #E0A89A;
    --border-color: #E6EFE9;
    --shadow: 0 4px 16px rgba(140, 170, 155, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  body {
    background-color: var(--bg-color);
    background-image: linear-gradient(rgba(255,255,255,0.4) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.4) 1px, transparent 1px);
    background-size: 22px 22px;
    min-height: 100vh;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 500px; padding: 12px 14px 90px; }

  .book-bar {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 6px 2px 10px; margin-bottom: 6px; scrollbar-width: none;
  }
  .book-bar::-webkit-scrollbar { display: none; }

  .book-pill {
    flex-shrink: 0; padding: 8px 16px; background: white; border-radius: 30px;
    font-size: 0.82rem; font-weight: 600; color: var(--text-muted);
    box-shadow: var(--shadow); cursor: pointer;
    border: 1.5px solid transparent; transition: 0.15s;
    display: flex; align-items: center; gap: 5px;
  }
  .book-pill.active { background: var(--panel-green); color: white; border-color: var(--panel-green); }
  .book-pill .del-book { margin-left: 4px; color: rgba(255,255,255,0.8); font-size: 0.85rem; }
  .book-pill:not(.active) .del-book { color: #C8B8A8; }

  .add-book-btn {
    flex-shrink: 0; padding: 8px 14px; background: white;
    border: 1.5px dashed var(--accent-green); border-radius: 30px;
    font-size: 0.82rem; font-weight: 600; color: var(--accent-green);
    cursor: pointer;
  }

  .header { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px 8px; }
  .header .title { font-size: 1.15rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
  .header .icon-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; width: auto; padding: 6px; color: var(--text-main); }

  .summary-card {
    background: #FDF8EC; border-radius: 24px; padding: 16px 18px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: var(--shadow); margin-bottom: 20px;
  }
  .summary-month { display: flex; flex-direction: column; gap: 4px; }
  .summary-month .year { font-size: 0.75rem; color: var(--text-muted); }
  .summary-month .month-row {
    display: flex; align-items: center; gap: 4px;
    cursor: pointer;
    position: relative;
  }
  .summary-month .month-num {
    font-size: 1.6rem; font-weight: 700; color: var(--text-main); line-height: 1;
  }
  .summary-month .month-suffix {
    font-size: 1rem; font-weight: 500; color: var(--text-main); line-height: 1;
  }
  .summary-month .month-arrow {
    font-size: 0.7rem; color: var(--text-muted); margin-left: 2px;
    transform: translateY(1px);
  }

  .month-picker-hidden {
    position: absolute;
    opacity: 0;
    width: 100%; height: 100%;
    left: 0; top: 0;
    cursor: pointer;
    border: none;
    z-index: 2;
  }

  .summary-stats { display: flex; gap: 16px; }
  .stat-item { text-align: center; display: flex; flex-direction: column; gap: 2px; }
  .stat-item .label { font-size: 0.7rem; color: var(--text-muted); }
  .stat-item .val { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
  .stat-item .val.income { color: var(--accent-green); }
  .stat-item .val.expense { color: var(--accent-red); }

  .list-section { background: #fff; border-radius: 24px; padding: 6px 16px 12px; box-shadow: var(--shadow); margin-bottom: 20px; }
  .day-group { border-bottom: 1px dashed var(--border-color); }
  .day-group:last-child { border-bottom: none; }
  .day-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 0 10px; font-size: 0.8rem; color: var(--text-muted); border-bottom: 1px dashed var(--border-color); margin-bottom: 4px; }
  .day-header .date-part { font-weight: 600; color: var(--text-main); font-size: 0.85rem; }
  .day-header .day-summary { display: flex; gap: 14px; font-size: 0.75rem; }
  .day-header .day-summary span.exp { color: var(--accent-red); }
  .day-header .day-summary span.inc { color: var(--accent-green); }

  .record-item { display: flex; align-items: center; padding: 12px 0; gap: 12px; border-bottom: 1px dashed var(--border-color); }
  .record-item:last-child { border-bottom: none; padding-bottom: 14px; }
  .record-icon { width: 40px; height: 40px; border-radius: 12px; background: #F4F9F6; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; overflow: hidden; }
  .record-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .record-info .cat-name { font-size: 1rem; font-weight: 600; color: var(--text-main); }
  .record-info .desc { font-size: 0.75rem; color: var(--text-muted); }
  .record-amount { font-size: 1.1rem; font-weight: 700; font-family: 'Courier New', monospace; }
  .record-amount.expense { color: var(--accent-red); }
  .record-amount.income { color: var(--accent-green); }

  .empty-state { padding: 40px 0; text-align: center; color: var(--text-muted); }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }

  .fab {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    width: 60px; height: 60px; border-radius: 50%; background: #B08D74;
    color: white; border: none; font-size: 2rem; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(176,141,116,0.4); cursor: pointer; z-index: 100; padding: 0;
  }
  .fab:active { transform: translateX(-50%) scale(0.92); }

  .bottom-bar { display: flex; justify-content: space-between; padding: 10px 4px; margin-top: 10px; }
  .bottom-bar button { background: white; border: 1px solid var(--border-color); border-radius: 20px; padding: 8px 18px; font-size: 0.85rem; font-weight: 500; color: var(--text-main); width: auto; cursor: pointer; }

  .modal { display: none; position: fixed; inset: 0; background: rgba(235,245,240,0.96); z-index: 200; padding: 16px 14px 30px; overflow-y: auto; }
  .modal.active { display: block; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 8px 4px; }
  .modal-header h2 { font-size: 1.25rem; color: var(--text-main); }
  .modal-header button { background: none; border: none; font-size: 0.95rem; color: var(--text-muted); width: auto; padding: 8px; cursor: pointer; }

  .form-card { background: white; border-radius: 24px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
  .form-group input, .form-group select {
    width: 100%; padding: 12px 16px; border-radius: 16px; border: 1px solid var(--border-color); background: #F9FBF9; font-size: 1rem; outline: none;
  }
  .date-input-wrapper { display: flex; align-items: center; gap: 8px; background: #F9FBF9; border: 1px solid var(--border-color); border-radius: 16px; padding: 4px 12px 4px 16px; }
  .date-input-wrapper input { border: none; background: transparent; padding: 10px 0; font-size: 0.95rem; width: 100%; outline: none; }

  .type-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
  .type-toggle button {
    flex: 1; padding: 10px; border-radius: 16px; border: none; font-weight: 600; font-size: 0.95rem;
    background: white; color: var(--text-muted); cursor: pointer;
  }
  .type-toggle button.active { background: var(--text-main); color: white; }

  .category-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chip {
    padding: 8px 14px; background: #F4F9F6; border: 1px solid transparent;
    border-radius: 20px; font-size: 0.85rem; color: var(--text-main); cursor: pointer;
  }
  .chip.active { background: #E8F2EE; border-color: var(--accent-green); font-weight: 600; }

  .icon-input-row { display: flex; gap: 10px; align-items: center; }
  .icon-input-row input {
    flex: 1; padding: 14px; border-radius: 16px;
    border: 1px solid var(--border-color); background: #F9FBF9;
    font-size: 1.6rem; outline: none; text-align: center;
    letter-spacing: 2px;
  }
  .icon-input-row input:focus { border-color: var(--accent-green); }
  .icon-preview-box {
    width: 54px; height: 54px; border-radius: 14px; background: #F4F9F6;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; flex-shrink: 0;
    border: 1px dashed var(--border-color);
  }
  .icon-input-tip { font-size: 0.7rem; color: var(--text-muted); margin-top: 6px; padding-left: 4px; line-height: 1.5; }

  .color-picker {
    display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; padding: 12px;
    background: #F8FAF9; border-radius: 16px; border: 1px solid var(--border-color);
  }
  .color-option {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
    transition: 0.15s;
  }
  .color-option.selected { border-color: #4A5B52; box-shadow: 0 0 0 2px rgba(74,91,82,0.25); }

  .new-cat-row { display: flex; gap: 8px; margin-top: 8px; }
  .new-cat-row input[type="text"] { flex: 1; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--border-color); font-size: 0.9rem; }
  .new-cat-row button { padding: 8px 16px; border-radius: 12px; background: var(--accent-green); color: white; border: none; width: auto; font-size: 0.85rem; font-weight: 600; cursor: pointer; }

  .btn-primary {
    width: 100%; padding: 16px; border-radius: 20px; background: var(--accent-green);
    color: white; border: none; font-size: 1rem; font-weight: 600;
    box-shadow: 0 4px 12px rgba(109,157,133,0.3); cursor: pointer;
  }

  .analysis-page { display: none; }
  .analysis-page.active { display: block; }

  /* ===== 分析页顶部栏 ===== */
  .analysis-topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }

  /* 月份选择胶囊：去掉原生 input，改成纯展示文字 + 点击触发 */
  .pill-select {
    background: white; border: none; border-radius: 30px; padding: 8px 14px;
    font-size: 0.8rem; font-weight: 500; color: var(--text-main); box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    position: relative;
    user-select: none;
    transition: 0.15s;
  }
  .pill-select:active { transform: scale(0.97); }
  .pill-select .pill-label {
    white-space: nowrap;
    font-size: 0.85rem;
  }
  /* 隐藏的原生月份 input，用来弹出选择器 */
  .pill-select .hidden-picker {
    position: absolute;
    opacity: 0;
    width: 100%; height: 100%;
    left: 0; top: 0;
    cursor: pointer;
    border: none;
    z-index: 2;
  }

  .topbar-spacer { flex: 1; }
  .mini-toggle { display: flex; background: white; border-radius: 30px; padding: 3px; box-shadow: var(--shadow); }
  .mini-toggle button {
    border: none; background: transparent; padding: 6px 14px; border-radius: 30px;
    font-size: 0.8rem; font-weight: 600; color: var(--text-muted); cursor: pointer; width: auto;
  }
  .mini-toggle button.active { background: #F8E7C0; color: #8A6D3B; }

  .stat-banner {
    background: var(--panel-green); border-radius: 24px; padding: 20px; margin-bottom: 16px;
    position: relative; overflow: hidden; color: white;
    box-shadow: 0 6px 18px rgba(140,180,160,0.35);
  }
  .stat-banner .banner-label { font-size: 0.8rem; opacity: 0.9; margin-bottom: 8px; }
  .stat-banner .banner-amount { font-size: 2.2rem; font-weight: 800; }
  .stat-banner .banner-amount small { font-size: 1rem; font-weight: 500; opacity: 0.9; margin-left: 2px; }

  .panel-card {
    background: white; border-radius: 24px; padding: 18px 18px 14px;
    margin-bottom: 16px; box-shadow: var(--shadow); position: relative;
  }
  .panel-card.folded::after {
    content: ""; position: absolute; top: 0; right: 0; width: 28px; height: 28px;
    background: linear-gradient(225deg, var(--bg-color) 50%, #F0F6F2 50%);
    border-bottom-left-radius: 14px; border-top-right-radius: 24px;
  }
  .panel-title { font-size: 1rem; font-weight: 700; color: var(--text-main); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
  .trend-highlight { font-size: 0.85rem; color: var(--text-main); margin-bottom: 14px; line-height: 1.6; }
  .trend-highlight .hl-date { color: #C08B5C; font-weight: 700; background: #FBEEDC; padding: 2px 6px; border-radius: 6px; }
  .trend-highlight .hl-amount { color: #C05A4A; font-weight: 800; font-size: 1rem; }
  .trend-chart-container { position: relative; width: 100%; height: 160px; margin-top: 6px; }

  .rank-list { list-style: none; }
  .rank-row { display: flex; align-items: center; padding: 14px 4px; gap: 12px; border-bottom: 1px solid #F4F8F5; }
  .rank-row:last-child { border-bottom: none; }
  .rank-medal { width: 28px; text-align: center; font-size: 1.2rem; flex-shrink: 0; }
  .rank-medal .num {
    display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center;
    border-radius: 50%; background: #F0F5F2; color: #8A9A91; font-size: 0.8rem; font-weight: 700;
  }
  .rank-icon {
    width: 38px; height: 38px; border-radius: 12px; background: #F4F9F6;
    display: flex; align-items: center; justify-content: center; font-size: 1.25rem; flex-shrink: 0;
  }
  .rank-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .rank-name { font-size: 0.95rem; font-weight: 600; color: var(--text-main); }
  .rank-count { font-size: 0.7rem; color: var(--text-muted); }
  .rank-amount { font-size: 0.95rem; font-weight: 700; color: #8A6D3B; white-space: nowrap; font-family: 'Courier New', monospace; }

  .pie-legend {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 14px;
    max-height: 240px; overflow-y: auto;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--text-main); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-amount { color: var(--text-muted); margin-left: auto; font-family: 'Courier New', monospace; font-size: 0.75rem; }
  .pie-chart-container { position: relative; width: 100%; height: 220px; }

  .settings-cat-row {
    display: flex; justify-content: space-between; align-items: center; background: white;
    padding: 12px 16px; border-radius: 16px; margin-bottom: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.02);
  }
  .settings-cat-row .cat-color-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  .settings-cat-row button { background: none; border: none; color: var(--accent-red); cursor: pointer; font-size: 1rem; width: auto; padding: 4px; }

  .add-book-inline { display: flex; gap: 8px; margin: 0 0 10px; }
  .add-book-inline input {
    flex: 1; padding: 10px 14px; border-radius: 30px; border: 1px solid var(--border-color);
    font-size: 0.9rem; outline: none; background: white;
  }
  .add-book-inline button {
    padding: 10px 18px; border-radius: 30px; background: var(--accent-green); color: white;
    border: none; width: auto; font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>

<div class="app">
  <div id="mainView">
    <div class="book-bar" id="bookBar"></div>

    <div class="header">
      <div class="title"><span>📒</span> <span id="currentBookTitle">默认账本</span></div>
      <button class="icon-btn" onclick="openAnalysis()">📋</button>
    </div>

    <div class="summary-card">
      <div class="summary-month">
        <span class="year" id="currentYear">2026年</span>
        <div class="month-row" onclick="triggerMonthPicker()">
          <span class="month-num" id="currentMonthNum">09</span>
          <span class="month-suffix">月</span>
          <span class="month-arrow">▾</span>
          <input type="month" id="hiddenMonthPicker" class="month-picker-hidden" onchange="onMonthChange(this)">
        </div>
      </div>
      <div class="summary-stats">
        <div class="stat-item">
          <span class="label">收入</span>
          <span class="val income" id="sumIncome">0.00</span>
        </div>
        <div class="stat-item">
          <span class="label">支出</span>
          <span class="val expense" id="sumExpense">0.00</span>
        </div>
        <div class="stat-item">
          <span class="label">结余</span>
          <span class="val" id="sumBalance">0.00</span>
        </div>
      </div>
    </div>

    <div class="list-section" id="recordList">
      <div class="empty-state">
        <div class="icon">📭</div>
        还没有记账哦，点击下方 + 开始记一笔
      </div>
    </div>

    <div class="bottom-bar">
      <button onclick="openSettings()">⚙️ 分类设置</button>
      <button onclick="clearCurrentData()">🗑️ 清空当前</button>
    </div>
  </div>

  <div id="analysisPage" class="analysis-page">
    <div class="header">
      <div class="title"><span>📋</span> 统计图表</div>
      <button class="icon-btn" onclick="closeAnalysis()">← 返回</button>
    </div>

    <!-- 顶部栏：整个月份胶囊可点击，点击日历 emoji 也能弹出 -->
    <div class="analysis-topbar">
      <div class="pill-select" onclick="triggerAnaMonthPicker()">
        <span>📅</span>
        <span class="pill-label" id="anaMonthLabel">2026年09月</span>
        <input type="month" id="anaMonthPicker" class="hidden-picker" onchange="onAnaMonthChange(this)">
      </div>
      <div class="pill-select" style="cursor:default;">
        <span>📘</span> <span id="anaBookName">默认账本</span>
      </div>
      <div class="topbar-spacer"></div>
      <div class="mini-toggle" id="anaTypeToggle">
        <button data-type="expense" class="active">支出</button>
        <button data-type="income">收入</button>
      </div>
    </div>

    <div class="stat-banner">
      <div class="banner-label" id="bannerLabel">支出0笔 合计</div>
      <div class="banner-amount" id="bannerAmount">¥0.00</div>
    </div>

    <div class="panel-card folded">
      <div class="panel-title">📈 <span id="trendTitle">支出趋势</span></div>
      <div class="trend-highlight" id="trendHighlight">本月暂无数据</div>
      <div class="trend-chart-container">
        <canvas id="trendChart"></canvas>
      </div>
    </div>

    <div class="panel-card">
      <div class="panel-title">🏆 <span id="rankTitle">支出分类排行榜</span></div>
      <ul class="rank-list" id="rankList"></ul>
    </div>

    <div class="panel-card">
      <div class="panel-title">🧩 <span id="pieTitle">支出占比</span></div>
      <div class="pie-chart-container">
        <canvas id="pieChart"></canvas>
      </div>
      <div class="pie-legend" id="pieLegend"></div>
    </div>
  </div>
</div>

<button class="fab" onclick="openAddForm()">+</button>

<div class="modal" id="addModal">
  <div class="modal-header">
    <h2>记一笔</h2>
    <button onclick="closeModal('addModal')">✕ 关闭</button>
  </div>

  <div class="type-toggle" id="modalTypeToggle">
    <button data-type="expense" class="active">💸 支出</button>
    <button data-type="income">💰 收入</button>
  </div>

  <div class="form-card">
    <div class="form-group" id="modalBookGroup">
      <label>记入账本</label>
      <select id="modalBookSelect"></select>
    </div>

    <div class="form-group">
      <label>日期</label>
      <div class="date-input-wrapper">
        <span style="font-size:1.1rem;">📅</span>
        <input type="date" id="modalDate">
      </div>
    </div>

    <div class="form-group">
      <label>分类（点击选择）</label>
      <div class="category-chips" id="modalCategoryChips"></div>
    </div>

    <div class="form-group" style="border-top: 1px dashed var(--border-color); padding-top: 14px; margin-top: 4px;">
      <label>添加新分类</label>

      <div style="font-size:0.75rem; color:var(--text-muted); margin-bottom:6px;">① 图标（自己输入一个符号或 Emoji）</div>
      <div class="icon-input-row">
        <input type="text" id="iconCustomInput" placeholder="🏷️" maxlength="4" oninput="onIconInput(this)">
        <div class="icon-preview-box" id="iconPreviewBox">🏷️</div>
      </div>
      <div class="icon-input-tip">
        💡 直接敲键盘输入任意一个字符或 Emoji 即可，比如：🍜、🐱、🚗、💼、⭐
      </div>

      <div style="font-size:0.75rem; color:var(--text-muted); margin: 14px 0 4px;">② 选颜色（不选自动分配）</div>
      <div class="color-picker" id="colorPicker"></div>

      <div class="new-cat-row">
        <input type="text" id="newCatName" placeholder="输入分类名" maxlength="8">
        <button onclick="addCustomCategory()">添加</button>
      </div>
    </div>

    <div class="form-group" style="margin-top:20px;">
      <label>金额 (¥)</label>
      <input type="number" id="modalAmount" placeholder="0.00" min="0.01" step="0.01" inputmode="decimal">
    </div>
    <div class="form-group">
      <label>备注 (可选)</label>
      <input type="text" id="modalDesc" placeholder="例如：午餐" maxlength="20">
    </div>
    <button class="btn-primary" onclick="saveRecord()">保存记录</button>
  </div>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-header">
    <h2>⚙️ 分类管理</h2>
    <button onclick="closeModal('settingsModal')">✕ 关闭</button>
  </div>
  <div class="type-toggle" id="settingsTypeToggle">
    <button data-type="expense" class="active">💸 支出分类</button>
    <button data-type="income">💰 收入分类</button>
  </div>
  <div id="settingsCategoryList" style="margin-top:10px;"></div>
</div>

<div class="modal" id="bookModal">
  <div class="modal-header">
    <h2>📚 账本管理</h2>
    <button onclick="closeModal('bookModal')">✕ 关闭</button>
  </div>
  <div class="form-card">
    <div class="form-group">
      <label>新建账本</label>
      <div class="add-book-inline">
        <input type="text" id="newBookName" placeholder="例如：旅行账本" maxlength="10">
        <button onclick="handleCreateBook()">创建</button>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:0;">
      <label>已有账本</label>
      <div id="bookManageList"></div>
    </div>
  </div>
</div>

<script>
  const KEYS = {
    BOOKS: 'h_books',
    ACTIVE_BOOK: 'h_active_book',
    EXPENSES: 'h_expenses_',
    INCOMES: 'h_incomes_',
    CAT_EXPENSE: 'h_cat_expense_',
    CAT_INCOME: 'h_cat_income_'
  };

  const DEFAULT_ICON = '🏷️';

  const DEFAULT_EXP_CATS = ['🍔 餐饮', '🚇 出行', '🛍️ 购物', '🎬 娱乐', '🏠 居住', '💊 医疗', '📚 教育', '📦 其他'];
  const DEFAULT_INC_CATS = ['💼 工资', '🎁 奖金', '📈 投资', '💪 兼职', '🧧 红包', '📦 其他'];

  const MACARON_COLORS = [
    '#F2C9B0','#C8D9E6','#F5E6B8','#C9DFD2','#E6C9D6','#B8D0C6','#EBD3C0','#D6CBE8',
    '#F5D1C1','#C7DCE8','#E8E2C5','#D6E6D8','#F0C8D0','#C5D8C0','#E8CFB8','#CCD5E8',
    '#F2D9B8','#C1D9D4','#E0C8D8','#D4DCC0'
  ];

  // ==================== 账本管理 ====================
  function getBooks() {
    const raw = localStorage.getItem(KEYS.BOOKS);
    if (!raw) {
      const defaultBooks = [{ id: 'b1', name: '默认账本' }];
      localStorage.setItem(KEYS.BOOKS, JSON.stringify(defaultBooks));
      return defaultBooks;
    }
    try {
      const arr = JSON.parse(raw);
      return Array.isArray(arr) && arr.length ? arr : [{ id: 'b1', name: '默认账本' }];
    } catch(e) {
      return [{ id: 'b1', name: '默认账本' }];
    }
  }

  function saveBooks(books) { localStorage.setItem(KEYS.BOOKS, JSON.stringify(books)); }

  function getActiveBookId() {
    const id = localStorage.getItem(KEYS.ACTIVE_BOOK);
    const books = getBooks();
    if (!id) return books[0].id;
    if (books.some(b => b.id === id)) return id;
    return books[0].id;
  }

  function setActiveBookId(id) { localStorage.setItem(KEYS.ACTIVE_BOOK, id); }

  function getBookName(id) {
    const book = getBooks().find(b => b.id === id);
    return book ? book.name : '未知账本';
  }

  function handleCreateBook() {
    const input = document.getElementById('newBookName');
    const name = input.value.trim();
    if (!name) { alert('请输入账本名'); return; }
    if (name.length > 10) { alert('账本名不能超过10个字'); return; }

    const books = getBooks();
    if (books.some(b => b.name === name)) { alert('账本名已存在'); return; }
    if (books.length >= 10) { alert('最多10个账本'); return; }

    const newBook = { id: 'b' + Date.now(), name: name };
    books.push(newBook);
    saveBooks(books);

    input.value = '';
    renderBookManageList();
    renderBookBar();
    alert(`账本「${name}」创建成功！`);
  }

  function deleteBook(id) {
    const books = getBooks();
    if (books.length <= 1) return { success: false, message: '至少保留一个账本' };
    const book = books.find(b => b.id === id);
    if (!book) return { success: false, message: '账本不存在' };
    const filtered = books.filter(b => b.id !== id);
    saveBooks(filtered);
    localStorage.removeItem(KEYS.EXPENSES + id);
    localStorage.removeItem(KEYS.INCOMES + id);
    localStorage.removeItem(KEYS.CAT_EXPENSE + id);
    localStorage.removeItem(KEYS.CAT_INCOME + id);
    if (getActiveBookId() === id) {
      setActiveBookId(filtered[0].id);
    }
    return { success: true };
  }

  // ==================== 数据操作 ====================
  function getCategories(type, bookId) {
    const key = (type === 'expense' ? KEYS.CAT_EXPENSE : KEYS.CAT_INCOME) + bookId;
    const def = type === 'expense' ? DEFAULT_EXP_CATS : DEFAULT_INC_CATS;
    const raw = localStorage.getItem(key);
    if (!raw) { localStorage.setItem(key, JSON.stringify(def)); return [...def]; }
    try {
      const arr = JSON.parse(raw);
      return Array.isArray(arr) && arr.length ? arr : [...def];
    } catch(e) { return [...def]; }
  }

  function saveCategories(type, bookId, arr) {
    const key = (type === 'expense' ? KEYS.CAT_EXPENSE : KEYS.CAT_INCOME) + bookId;
    const cleaned = arr.map(c => c.trim()).filter(c => c).filter((v,i,s) => s.indexOf(v) === i).slice(0, 30);
    localStorage.setItem(key, JSON.stringify(cleaned));
  }

  function addCategory(type, bookId, name) {
    const trimmed = name.trim();
    if (!trimmed) return false;
    const cats = getCategories(type, bookId);
    if (cats.includes(trimmed)) return false;
    cats.push(trimmed);
    saveCategories(type, bookId, cats);
    return true;
  }

  function removeCategory(type, bookId, name) {
    const cats = getCategories(type, bookId).filter(c => c !== name);
    if (cats.length === 0) return false;
    saveCategories(type, bookId, cats);
    return true;
  }

  function getRecords(type, bookId) {
    const key = (type === 'expense' ? KEYS.EXPENSES : KEYS.INCOMES) + bookId;
    const raw = localStorage.getItem(key);
    if (!raw) return [];
    try {
      const d = JSON.parse(raw);
      return Array.isArray(d) ? d : [];
    } catch(e) { return []; }
  }

  function saveRecords(type, bookId, arr) {
    const key = (type === 'expense' ? KEYS.EXPENSES : KEYS.INCOMES) + bookId;
    localStorage.setItem(key, JSON.stringify(arr));
  }

  function addRecord(type, bookId, category, amount, desc, dateStr) {
    const records = getRecords(type, bookId);
    let timestamp;
    if (dateStr) {
      const parts = dateStr.split('-');
      timestamp = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 12, 0, 0).getTime();
    } else {
      timestamp = Date.now();
    }
    records.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2,6),
      category, amount: Number(amount),
      desc: desc.trim() || '',
      timestamp
    });
    saveRecords(type, bookId, records);
  }

  // ==================== 全局状态 ====================
  let modalRecordType = 'expense';
  let settingsType = 'expense';
  let anaType = 'expense';
  let selectedIcon = DEFAULT_ICON;
  let selectedColor = null;
  let trendChartInstance = null;
  let pieChartInstance = null;

  let viewYear = new Date().getFullYear();
  let viewMonth = new Date().getMonth();

  // ==================== 工具 ====================
  function getTodayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function escapeHtml(t) {
    if (!t) return '';
    const d = document.createElement('div'); d.textContent = t; return d.innerHTML;
  }

  // ==================== 主页面月份选择 ====================
  function triggerMonthPicker() {
    const picker = document.getElementById('hiddenMonthPicker');
    picker.value = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}`;
    if (picker.showPicker) {
      picker.showPicker();
    } else {
      picker.click();
    }
  }

  function onMonthChange(input) {
    if (!input.value) return;
    const [y, m] = input.value.split('-').map(Number);
    viewYear = y;
    viewMonth = m - 1;
    renderMain();
  }

  // ==================== 分析页月份选择 ====================
  function triggerAnaMonthPicker() {
    const picker = document.getElementById('anaMonthPicker');
    if (!picker.value) {
      const now = new Date();
      picker.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    }
    if (picker.showPicker) {
      picker.showPicker();
    } else {
      picker.click();
    }
  }

  function onAnaMonthChange(input) {
    if (!input.value) return;
    const [y, m] = input.value.split('-').map(Number);
    // 更新标签显示
    document.getElementById('anaMonthLabel').textContent = `${y}年${String(m).padStart(2,'0')}月`;
    renderAnalysis();
  }

  // ==================== 图标输入处理 ====================
  function onIconInput(input) {
    const val = input.value;
    if (val.length > 0) {
      const chars = Array.from(val);
      const last = chars[chars.length - 1];
      selectedIcon = last;
      document.getElementById('iconPreviewBox').textContent = selectedIcon;
      if (val !== last) {
        input.value = last;
      }
    } else {
      selectedIcon = DEFAULT_ICON;
      document.getElementById('iconPreviewBox').textContent = DEFAULT_ICON;
    }
  }

  // ==================== 账本切换条 ====================
  function renderBookBar() {
    const books = getBooks();
    const activeId = getActiveBookId();
    const bar = document.getElementById('bookBar');
    let html = '';
    books.forEach(b => {
      const active = activeId === b.id;
      html += `
        <div class="book-pill ${active ? 'active' : ''}" onclick="switchBook('${b.id}')">
          📘 ${escapeHtml(b.name)}
          ${books.length > 1 ? `<span class="del-book" onclick="event.stopPropagation(); confirmDeleteBook('${b.id}')">✕</span>` : ''}
        </div>
      `;
    });
    html += `<div class="add-book-btn" onclick="openBookModal()">＋ 新建</div>`;
    bar.innerHTML = html;
  }

  function switchBook(id) {
    setActiveBookId(id);
    const now = new Date();
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();
    renderBookBar();
    renderMain();
    updateHeaderTitle();
  }

  function updateHeaderTitle() {
    const id = getActiveBookId();
    document.getElementById('currentBookTitle').textContent = getBookName(id);
  }

  function confirmDeleteBook(id) {
    const name = getBookName(id);
    if (!confirm(`确定删除账本「${name}」吗？\n该账本内的所有记录也会被删除。`)) return;
    const result = deleteBook(id);
    if (!result.success) { alert(result.message); return; }
    renderBookBar();
    renderMain();
    updateHeaderTitle();
  }

  function openBookModal() {
    document.getElementById('bookModal').classList.add('active');
    renderBookManageList();
  }

  function renderBookManageList() {
    const books = getBooks();
    const activeId = getActiveBookId();
    const container = document.getElementById('bookManageList');
    container.innerHTML = books.map(b => {
      const active = activeId === b.id;
      return `
        <div class="settings-cat-row">
          <span>${active ? '✅ ' : '📘 '}${escapeHtml(b.name)}</span>
          ${books.length > 1 ? `<button onclick="deleteBookFromManage('${b.id}')">✕</button>` : ''}
        </div>
      `;
    }).join('');
  }

  function deleteBookFromManage(id) {
    const name = getBookName(id);
    if (!confirm(`确定删除账本「${name}」吗？\n该账本内的所有记录也会被删除。`)) return;
    const result = deleteBook(id);
    if (!result.success) { alert(result.message); return; }
    renderBookManageList();
    renderBookBar();
    renderMain();
    updateHeaderTitle();
  }

  // ==================== 主页面渲染 ====================
  function renderMain() {
    document.getElementById('currentYear').textContent = viewYear + '年';
    document.getElementById('currentMonthNum').textContent = String(viewMonth + 1).padStart(2, '0');

    const activeBookId = getActiveBookId();
    const expenses = getRecords('expense', activeBookId);
    const incomes = getRecords('income', activeBookId);

    const monthExp = expenses.filter(r => {
      const d = new Date(r.timestamp);
      return d.getFullYear() === viewYear && d.getMonth() === viewMonth;
    }).reduce((s, r) => s + r.amount, 0);
    const monthInc = incomes.filter(r => {
      const d = new Date(r.timestamp);
      return d.getFullYear() === viewYear && d.getMonth() === viewMonth;
    }).reduce((s, r) => s + r.amount, 0);

    document.getElementById('sumIncome').textContent = '¥' + monthInc.toFixed(2);
    document.getElementById('sumExpense').textContent = '¥' + monthExp.toFixed(2);
    document.getElementById('sumBalance').textContent = '¥' + (monthInc - monthExp).toFixed(2);

    const monthAll = [
      ...expenses.filter(r => {
        const d = new Date(r.timestamp);
        return d.getFullYear() === viewYear && d.getMonth() === viewMonth;
      }).map(r => ({ ...r, type: 'expense' })),
      ...incomes.filter(r => {
        const d = new Date(r.timestamp);
        return d.getFullYear() === viewYear && d.getMonth() === viewMonth;
      }).map(r => ({ ...r, type: 'income' }))
    ].sort((a, b) => b.timestamp - a.timestamp);

    const listEl = document.getElementById('recordList');
    if (monthAll.length === 0) {
      listEl.innerHTML = `<div class="empty-state"><div class="icon">📭</div>${viewYear}年${viewMonth+1}月还没有记录</div>`;
      return;
    }

    const dayMap = new Map();
    monthAll.forEach(r => {
      const d = new Date(r.timestamp);
      const dayKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if (!dayMap.has(dayKey)) dayMap.set(dayKey, { dateObj: d, records: [] });
      dayMap.get(dayKey).records.push(r);
    });

    const sortedDays = Array.from(dayMap.entries()).sort((a, b) => b[1].dateObj - a[1].dateObj);
    const weekdays = ['日','一','二','三','四','五','六'];
    let html = '';

    sortedDays.forEach(([dayKey, dayData]) => {
      const d = dayData.dateObj;
      const dateLabel = `${String(d.getMonth()+1).padStart(2,'0')}月${String(d.getDate()).padStart(2,'0')}日`;
      const weekLabel = `周${weekdays[d.getDay()]}`;

      let dayExp = 0, dayInc = 0;
      dayData.records.forEach(r => {
        if (r.type === 'expense') dayExp += r.amount;
        else dayInc += r.amount;
      });

      html += `
        <div class="day-group">
          <div class="day-header">
            <span class="date-part">${dateLabel} ${weekLabel}</span>
            <span class="day-summary">
              ${dayExp > 0 ? `<span class="exp">支出 ¥${dayExp.toFixed(2)}</span>` : ''}
              ${dayInc > 0 ? `<span class="inc">收入 ¥${dayInc.toFixed(2)}</span>` : ''}
              ${dayExp === 0 && dayInc === 0 ? '<span>无收支</span>' : ''}
            </span>
          </div>
      `;

      dayData.records.forEach(r => {
        const catParts = r.category.split(' ');
        const icon = catParts.length > 1 ? catParts[0] : '📝';
        const catName = catParts.length > 1 ? catParts.slice(1).join(' ') : r.category;

        html += `
          <div class="record-item">
            <div class="record-icon">${icon}</div>
            <div class="record-info">
              <span class="cat-name">${escapeHtml(catName)}</span>
              <span class="desc">${escapeHtml(r.desc || '无备注')}</span>
            </div>
            <div class="record-amount ${r.type}">
              ${r.type === 'income' ? '+' : '-'}${r.amount.toFixed(2)}
            </div>
          </div>
        `;
      });

      html += `</div>`;
    });

    listEl.innerHTML = html;
  }

  // ==================== 添加记录弹窗 ====================
  function openAddForm() {
    const targetBookId = getActiveBookId();

    const bookSelect = document.getElementById('modalBookSelect');
    const books = getBooks();
    bookSelect.innerHTML = books.map(b =>
      `<option value="${b.id}" ${b.id === targetBookId ? 'selected' : ''}>${escapeHtml(b.name)}</option>`
    ).join('');

    document.getElementById('addModal').classList.add('active');
    modalRecordType = 'expense';
    document.querySelectorAll('#modalTypeToggle button').forEach(b => b.classList.toggle('active', b.dataset.type === 'expense'));
    renderModalCategoryChips();
    renderColorPicker();
    selectedIcon = DEFAULT_ICON;
    selectedColor = null;
    document.getElementById('iconCustomInput').value = '';
    document.getElementById('iconPreviewBox').textContent = DEFAULT_ICON;
    document.getElementById('newCatName').value = '';
    document.getElementById('modalDate').value = getTodayStr();
  }

  function getModalBookId() {
    return document.getElementById('modalBookSelect').value;
  }

  function renderModalCategoryChips() {
    const bookId = getModalBookId();
    const cats = getCategories(modalRecordType, bookId);
    const container = document.getElementById('modalCategoryChips');
    container.innerHTML = cats.map(c => {
      const idx = cats.indexOf(c);
      const color = MACARON_COLORS[idx % MACARON_COLORS.length];
      return `<span class="chip" onclick="selectModalCategory(this, '${escapeHtml(c)}')" style="border-left:4px solid ${color};">${escapeHtml(c)}</span>`;
    }).join('');
    const first = container.querySelector('.chip');
    if (first) first.classList.add('active');
  }

  function selectModalCategory(el, cat) {
    document.querySelectorAll('#modalCategoryChips .chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  }

  function renderColorPicker() {
    const container = document.getElementById('colorPicker');
    container.innerHTML = MACARON_COLORS.map((color) =>
      `<div class="color-option ${selectedColor === color ? 'selected' : ''}" 
            style="background:${color};" 
            onclick="selectColor('${color}', this)"></div>`
    ).join('');
  }

  function selectColor(color, el) {
    selectedColor = color;
    document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('selected'));
    el.classList.add('selected');
  }

  function addCustomCategory() {
    const input = document.getElementById('newCatName');
    const name = input.value.trim();
    if (!name) { alert('请输入分类名称'); return; }

    const bookId = getModalBookId();
    const icon = selectedIcon || DEFAULT_ICON;
    const finalName = `${icon} ${name}`;

    if (addCategory(modalRecordType, bookId, finalName)) {
      input.value = '';
      selectedIcon = DEFAULT_ICON;
      selectedColor = null;
      document.getElementById('iconCustomInput').value = '';
      document.getElementById('iconPreviewBox').textContent = DEFAULT_ICON;
      renderColorPicker();
      renderModalCategoryChips();
      alert('分类添加成功！');
    } else {
      alert('分类已存在或添加失败');
    }
  }

  function saveRecord() {
    const amountInput = document.getElementById('modalAmount');
    const descInput = document.getElementById('modalDesc');
    const dateInput = document.getElementById('modalDate');
    const activeChip = document.querySelector('#modalCategoryChips .chip.active');

    if (!activeChip) { alert('请选择分类'); return; }
    const amount = parseFloat(amountInput.value);
    if (isNaN(amount) || amount <= 0) { alert('请输入正确的金额'); return; }
    const dateStr = dateInput.value;
    if (!dateStr) { alert('请选择日期'); return; }

    const bookId = getModalBookId();
    addRecord(modalRecordType, bookId, activeChip.textContent, amount, descInput.value.trim(), dateStr);

    amountInput.value = '';
    descInput.value = '';
    dateInput.value = getTodayStr();
    closeModal('addModal');
    renderMain();
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('active');
  }

  // ==================== 分析页 ====================
  function openAnalysis() {
    document.getElementById('mainView').style.display = 'none';
    document.getElementById('analysisPage').classList.add('active');
    window.scrollTo(0, 0);

    const activeBookId = getActiveBookId();
    document.getElementById('anaBookName').textContent = getBookName(activeBookId);

    // 设置月份选择器 & 标签
    const picker = document.getElementById('anaMonthPicker');
    picker.value = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}`;
    document.getElementById('anaMonthLabel').textContent = `${viewYear}年${String(viewMonth+1).padStart(2,'0')}月`;

    anaType = 'expense';
    document.querySelectorAll('#anaTypeToggle button').forEach(b => b.classList.toggle('active', b.dataset.type === 'expense'));

    renderAnalysis();
  }

  function closeAnalysis() {
    document.getElementById('analysisPage').classList.remove('active');
    document.getElementById('mainView').style.display = 'block';
    if (trendChartInstance) { trendChartInstance.destroy(); trendChartInstance = null; }
    if (pieChartInstance) { pieChartInstance.destroy(); pieChartInstance = null; }
  }

  function renderAnalysis() {
    const picker = document.getElementById('anaMonthPicker');
    if (!picker.value) return;
    const [year, month] = picker.value.split('-').map(Number);
    const activeBookId = getActiveBookId();
    const records = getRecords(anaType, activeBookId);
    const allCategories = getCategories(anaType, activeBookId);

    const monthRecords = records.filter(r => {
      const d = new Date(r.timestamp);
      return d.getFullYear() === year && d.getMonth() === (month - 1);
    });

    const totalAmount = monthRecords.reduce((s, r) => s + r.amount, 0);
    const totalCount = monthRecords.length;
    const typeLabel = anaType === 'expense' ? '支出' : '收入';
    document.getElementById('bannerLabel').textContent = `${typeLabel}${totalCount}笔 合计`;
    document.getElementById('bannerAmount').textContent = `¥${totalAmount.toFixed(2)}`;

    const daysInMonth = new Date(year, month, 0).getDate();
    const dailyTotals = new Array(daysInMonth).fill(0);
    monthRecords.forEach(r => {
      const d = new Date(r.timestamp).getDate();
      dailyTotals[d - 1] += r.amount;
    });

    let maxIdx = -1, maxVal = 0;
    dailyTotals.forEach((v, i) => { if (v > maxVal) { maxVal = v; maxIdx = i; } });

    const trendHighlight = document.getElementById('trendHighlight');
    if (totalAmount === 0) {
      trendHighlight.innerHTML = '本月暂无数据';
    } else {
      trendHighlight.innerHTML = `本月内单日最高${typeLabel}<br>在 <span class="hl-date">${month}月${maxIdx + 1}日</span> 这一天，${typeLabel}了 <span class="hl-amount">¥${maxVal.toFixed(2)}</span>`;
    }

    document.getElementById('trendTitle').textContent = `${typeLabel}趋势`;

    if (trendChartInstance) { trendChartInstance.destroy(); trendChartInstance = null; }
    const trendCtx = document.getElementById('trendChart').getContext('2d');
    const lineColor = anaType === 'expense' ? '#E0A89A' : '#8FBBA7';
    const fillColor = anaType === 'expense' ? 'rgba(224,168,154,0.15)' : 'rgba(143,187,167,0.15)';

    trendChartInstance = new Chart(trendCtx, {
      type: 'line',
      data: {
        labels: Array.from({ length: daysInMonth }, (_, i) => `${i + 1}号`),
        datasets: [{
          data: dailyTotals,
          borderColor: lineColor,
          backgroundColor: fillColor,
          borderWidth: 2, fill: true, tension: 0.4,
          pointBackgroundColor: '#ffffff',
          pointBorderColor: lineColor,
          pointBorderWidth: 1.5,
          pointRadius: 3, pointHoverRadius: 5
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => `¥${ctx.parsed.y.toFixed(2)}` } } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 9 }, color: '#A3B5AB', maxRotation: 0, autoSkip: true, maxTicksLimit: 6 } },
          y: { display: false, beginAtZero: true }
        }
      }
    });

    const catMap = {};
    monthRecords.forEach(r => {
      const pureName = r.category.replace(/[\u{1F300}-\u{1F9FF}]/gu, '').trim() || r.category;
      const iconMatch = r.category.match(/[\u{1F300}-\u{1F9FF}]/u);
      const icon = iconMatch ? iconMatch[0] : '📝';
      if (!catMap[pureName]) catMap[pureName] = { amount: 0, count: 0, icon };
      catMap[pureName].amount += r.amount;
      catMap[pureName].count += 1;
    });

    const entries = Object.entries(catMap).sort((a, b) => b[1].amount - a[1].amount);
    document.getElementById('rankTitle').textContent = `${typeLabel}分类排行榜`;

    const rankList = document.getElementById('rankList');
    if (entries.length === 0) {
      rankList.innerHTML = '<div style="text-align:center; padding:20px; color:#A3B5AB;">暂无数据</div>';
    } else {
      rankList.innerHTML = entries.map(([cat, info], idx) => {
        let medal;
        if (idx === 0) medal = '👑';
        else if (idx === 1) medal = '🥈';
        else if (idx === 2) medal = '🥉';
        else medal = `<span class="num">${idx + 1}</span>`;
        return `
          <li class="rank-row">
            <div class="rank-medal">${medal}</div>
            <div class="rank-icon">${info.icon}</div>
            <div class="rank-info">
              <span class="rank-name">${escapeHtml(cat)}</span>
              <span class="rank-count">共${info.count}笔</span>
            </div>
            <div class="rank-amount">¥${info.amount.toFixed(2)}</div>
          </li>
        `;
      }).join('');
    }

    document.getElementById('pieTitle').textContent = `${typeLabel}占比`;
    const pieCtx = document.getElementById('pieChart').getContext('2d');
    if (pieChartInstance) { pieChartInstance.destroy(); pieChartInstance = null; }

    if (entries.length === 0) {
      pieChartInstance = null;
      document.getElementById('pieLegend').innerHTML = '<div style="text-align:center;color:#A3B5AB;grid-column:1/-1;">暂无数据</div>';
    } else {
      const colorMap = {};
      allCategories.forEach((cat, i) => {
        const pureName = cat.replace(/[\u{1F300}-\u{1F9FF}]/gu, '').trim() || cat;
        colorMap[pureName] = MACARON_COLORS[i % MACARON_COLORS.length];
      });

      const labels = entries.map(([cat]) => cat);
      const data = entries.map(([, info]) => info.amount);
      const colors = labels.map(cat => colorMap[cat] || MACARON_COLORS[0]);

      pieChartInstance = new Chart(pieCtx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: '#ffffff' }] },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '55%',
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: (ctx) => {
              const val = ctx.parsed;
              const pct = totalAmount > 0 ? (val / totalAmount * 100).toFixed(1) : 0;
              return `${ctx.label}: ¥${val.toFixed(2)} (${pct}%)`;
            }}}
          }
        }
      });

      document.getElementById('pieLegend').innerHTML = entries.map(([cat, info]) => {
        const color = colorMap[cat] || MACARON_COLORS[0];
        return `
          <div class="legend-item">
            <span class="legend-dot" style="background:${color}"></span>
            <span>${escapeHtml(cat)}</span>
            <span class="legend-amount">¥${info.amount.toFixed(2)}</span>
          </div>
        `;
      }).join('');
    }
  }

  // ==================== 设置分类 ====================
  function openSettings() {
    document.getElementById('settingsModal').classList.add('active');
    settingsType = 'expense';
    document.querySelectorAll('#settingsTypeToggle button').forEach(b => b.classList.toggle('active', b.dataset.type === 'expense'));
    renderSettingsList();
  }

  function renderSettingsList() {
    const bookId = getActiveBookId();
    const cats = getCategories(settingsType, bookId);
    const container = document.getElementById('settingsCategoryList');
    if (cats.length === 0) {
      container.innerHTML = '<p style="color:#A3B5AB; text-align:center; padding:20px;">暂无分类</p>';
      return;
    }
    container.innerHTML = cats.map((c, idx) => {
      const color = MACARON_COLORS[idx % MACARON_COLORS.length];
      return `
        <div class="settings-cat-row">
          <span><span class="cat-color-dot" style="background:${color};"></span>${escapeHtml(c)}</span>
          <button onclick="deleteCategoryAction('${escapeHtml(c)}')">✕</button>
        </div>
      `;
    }).join('');
  }

  function deleteCategoryAction(name) {
    if (confirm(`确定删除分类「${name}」吗？原有记录不受影响。`)) {
      const bookId = getActiveBookId();
      if (removeCategory(settingsType, bookId, name)) {
        renderSettingsList();
        renderMain();
      } else {
        alert('至少需要保留一个分类');
      }
    }
  }

  function clearCurrentData() {
    const bookId = getActiveBookId();
    const bookName = getBookName(bookId);
    if (!confirm(`⚠️ 确定要清空账本「${bookName}」的全部记录吗？此操作不可恢复。`)) return;
    localStorage.removeItem(KEYS.EXPENSES + bookId);
    localStorage.removeItem(KEYS.INCOMES + bookId);
    renderMain();
    alert(`账本「${bookName}」数据已清空`);
  }

  // ==================== 事件绑定 ====================
  document.getElementById('settingsTypeToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    settingsType = btn.dataset.type;
    document.querySelectorAll('#settingsTypeToggle button').forEach(b => b.classList.toggle('active', b.dataset.type === settingsType));
    renderSettingsList();
  });

  document.getElementById('modalTypeToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    modalRecordType = btn.dataset.type;
    document.querySelectorAll('#modalTypeToggle button').forEach(b => b.classList.toggle('active', b.dataset.type === modalRecordType));
    renderModalCategoryChips();
  });

  document.getElementById('modalBookSelect').addEventListener('change', () => {
    renderModalCategoryChips();
  });

  document.getElementById('anaTypeToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    anaType = btn.dataset.type;
    document.querySelectorAll('#anaTypeToggle button').forEach(b => b.classList.toggle('active', b.dataset.type === anaType));
    renderAnalysis();
  });

  window.handleCreateBook = handleCreateBook;
  window.deleteBookFromManage = deleteBookFromManage;
  window.confirmDeleteBook = confirmDeleteBook;
  window.switchBook = switchBook;
  window.openBookModal = openBookModal;
  window.openSettings = openSettings;
  window.openAnalysis = openAnalysis;
  window.closeAnalysis = closeAnalysis;
  window.closeModal = closeModal;
  window.openAddForm = openAddForm;
  window.selectModalCategory = selectModalCategory;
  window.selectColor = selectColor;
  window.addCustomCategory = addCustomCategory;
  window.saveRecord = saveRecord;
  window.clearCurrentData = clearCurrentData;
  window.onIconInput = onIconInput;
  window.deleteCategoryAction = deleteCategoryAction;
  window.triggerMonthPicker = triggerMonthPicker;
  window.onMonthChange = onMonthChange;
  window.triggerAnaMonthPicker = triggerAnaMonthPicker;
  window.onAnaMonthChange = onAnaMonthChange;

  window.onload = function() {
    getBooks();
    const activeId = getActiveBookId();
    if (!activeId) setActiveBookId(getBooks()[0].id);
    renderBookBar();
    updateHeaderTitle();
    renderMain();
  };
</script>
</body>
</html>
