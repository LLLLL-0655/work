  .info-row .val { font-weight: 600; color: #1E293B; }

    border-radius: 12px;

    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;

    background: #1E293B;

  }

  }

    background: white;
    color: #1E293B;
    border: 1px solid #E2E8F0;
  }

    padding: 14px 16px;

<div class="box">
  <h1>📥 一键导入账单</h1>
  <div class="sub">
    把 YoYo 2024 年账单数据导入到记账本（当前账本）。<br>
    重复记录会自动跳过，可放心多次点击。
  </div>

  <div class="info">
    <div class="info-row">
      <span class="label">目标账本</span>
      <span class="val" id="bookName">读取中…</span>
    </div>
    <div class="info-row">
      <span class="label">待导入条数</span>
      <span class="val" id="pendingCount">-</span>
    </div>
  </div>

  <button class="primary" id="importBtn" onclick="doImport()">开始导入</button>
  <button class="secondary" onclick="window.close()">关闭页面</button>

  <div class="result" id="result"></div>

<script>
// ==================== 存储键（与记账本一致）====================
const KEYS = {
  BOOKS: 'h_books',
  ACTIVE_BOOK: 'h_active_book',
  EXPENSES: 'h_expenses_',
  INCOMES: 'h_incomes_',
  CAT_EXPENSE: 'h_cat_expense_',
  CAT_INCOME: 'h_cat_income_'
};

// ==================== 账本读取 ====================
function getBooks() {
  try {
    const raw = localStorage.getItem(KEYS.BOOKS);
    if (!raw) return [{ id: 'b1', name: '默认账本' }];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) && arr.length ? arr : [{ id: 'b1', name: '默认账本' }];
  } catch(e) { return [{ id: 'b1', name: '默认账本' }]; }
}
function getActiveBookId() {
  const id = localStorage.getItem(KEYS.ACTIVE_BOOK);
  const books = getBooks();
  if (!id) return books[0].id;
  if (books.some(b => b.id === id)) return id;
  return books[0].id;
}
function getBookName(id) {
  const b = getBooks().find(x => x.id === id);
  return b ? b.name : '未知账本';
}

// ==================== 记录读写 ====================
function getRecords(type, bookId) {
  const key = (type === 'expense' ? KEYS.EXPENSES : KEYS.INCOMES) + bookId;
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return [];
    const d = JSON.parse(raw);
    return Array.isArray(d) ? d : [];
  } catch(e) { return []; }
}
function saveRecords(type, bookId, arr) {
  const key = (type === 'expense' ? KEYS.EXPENSES : KEYS.INCOMES) + bookId;
  localStorage.setItem(key, JSON.stringify(arr));
}
function getCategories(type, bookId) {
  const key = (type === 'expense' ? KEYS.CAT_EXPENSE : KEYS.CAT_INCOME) + bookId;
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch(e) { return []; }
}
function saveCategories(type, bookId, arr) {
  const key = (type === 'expense' ? KEYS.CAT_EXPENSE : KEYS.CAT_INCOME) + bookId;
  localStorage.setItem(key, JSON.stringify(arr));
}

// ==================== 工具 ====================
function getPureName(cat) {
  if (!cat) return '';
  const parts = cat.trim().split(/\s+/);
  if (parts.length > 1 && parts[0].length <= 2) {
    return parts.slice(1).join(' ');
  }
  return cat.trim();
}

function makeSignature(type, category, amount, desc, dateStr) {
  // 用日期（yyyy-mm-dd）+ 类型 + 分类名 + 金额 + 备注 作为唯一标识
  return [dateStr, type, getPureName(category), Number(amount).toFixed(2), (desc || '').trim()].join('|');
}

// ==================== 页面初始化 ====================
const activeBookId = getActiveBookId();
document.getElementById('bookName').textContent = getBookName(activeBookId);
document.getElementById('pendingCount').textContent = IMPORT_DATA.length + ' 条';

// ==================== 导入逻辑 ====================
function doImport() {
  const btn = document.getElementById('importBtn');
  btn.disabled = true;
  btn.textContent = '导入中…';

  try {
    const bookId = getActiveBookId();

    // 读取当前账本已有的记录
    let expenses = getRecords('expense', bookId);
    let incomes = getRecords('income', bookId);

    // 建立已有记录的签名集合，用于去重
    const existingSigs = new Set();
    expenses.forEach(r => {
      const d = new Date(r.timestamp);
      const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      existingSigs.add(makeSignature('expense', r.category, r.amount, r.desc, ds));
    });
    incomes.forEach(r => {
      const d = new Date(r.timestamp);
      const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      existingSigs.add(makeSignature('income', r.category, r.amount, r.desc, ds));
    });

    // 分类集合（用于自动补新分类）
    const expCats = new Set(getCategories('expense', bookId));
    const incCats = new Set(getCategories('income', bookId));

    let addedExp = 0, addedInc = 0, skipped = 0;
    let idCounter = Date.now();

    IMPORT_DATA.forEach(item => {
      const type = item.type; // 'expense' 或 'income'
      const sig = makeSignature(type, item.category, item.amount, item.desc, item.date);

      // 已存在则跳过
      if (existingSigs.has(sig)) {
        skipped++;
        return;
      }

      // 构造时间戳
      const parts = item.date.split('-');
      const timestamp = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 12, 0, 0).getTime();

      const record = {
        id: (idCounter++) + '-' + Math.random().toString(36).slice(2, 6),
        category: item.category,
        amount: Number(item.amount),
        desc: item.desc || '',
        timestamp
      };

      if (type === 'income') {
        incomes.push(record);
        incCats.add(item.category);
        addedInc++;
      } else {
        expenses.push(record);
        expCats.add(item.category);
        addedExp++;
      }
      existingSigs.add(sig);
    });

    // 保存
    saveRecords('expense', bookId, expenses);
    saveRecords('income', bookId, incomes);
    saveCategories('expense', bookId, Array.from(expCats));
    saveCategories('income', bookId, Array.from(incCats));

    const resultEl = document.getElementById('result');
    resultEl.className = 'result ok';
    resultEl.innerHTML = `
      <strong>✅ 导入完成！</strong><br>
      新增支出：<strong>${addedExp}</strong> 条<br>
      新增收入：<strong>${addedInc}</strong> 条<br>
      跳过重复：<strong>${skipped}</strong> 条<br><br>
      请关闭本页面，打开记账本查看。
    `;
    btn.textContent = '已导入';
  } catch(err) {
    const resultEl = document.getElementById('result');
    resultEl.className = 'result err';
    resultEl.innerHTML = `<strong>❌ 导入失败</strong><br>${err.message}`;
    btn.disabled = false;
    btn.textContent = '重新导入';
  }
}
</script>
